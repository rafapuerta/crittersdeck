[project]
name = "crittersdeck"
version = "0.1.0"
description = "A status board for Claude Code sessions across accounts and machines, drawn as critters"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
crittersdeck = "crittersdeck.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["crittersdeck*"]

[tool.setuptools.package-data]
crittersdeck = ["web/*", "web/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
